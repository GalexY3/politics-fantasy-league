name: PFL ranked experiment OSF metadata-only gate
on:
  push:
    branches:
      - research/pfl-rct-roster-exposure-gate-20261029
    paths:
      - .github/workflows/pfl-rct-osf-metadata-20261029.yml

permissions:
  contents: read
jobs:
  osf-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect public node and file listing only (no participant files)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request,urllib.error
          urls=[('node','https://api.osf.io/v2/nodes/ujncd/')]
          def query(url):
              req=urllib.request.Request(url,headers={'User-Agent':'PFL-Research-Metadata-Gate/1.0','Accept':'application/vnd.api+json'})
              with urllib.request.urlopen(req,timeout=18) as r:
                  raw=r.read(350001)
                  if len(raw)>350000:raise RuntimeError('METADATA_TOO_LARGE')
                  return r.status,json.loads(raw)
          for tag,url in urls:
              try:
                  status,data=query(url)
                  obj=data.get('data',{})
                  a=obj.get('attributes',{})
                  rr=obj.get('relationships',{})
                  output={'tag':tag,'http':status,'node_id':obj.get('id'),'title':a.get('title'),
                     'public':a.get('public'),'license':a.get('license'),'description_excerpt':str(a.get('description') or '')[:600],
                     'date_created':a.get('date_created'),'date_modified':a.get('date_modified'),
                     'file_listing_endpoint':rr.get('files',{}).get('links',{}).get('related',{}).get('href')}
                  print('PFL_OSF_NODE_META',json.dumps(output,ensure_ascii=False),flush=True)
                  fileurl=output['file_listing_endpoint']
                  if not fileurl:
                      print('PFL_OSF_NO_FILE_ENDPOINT',flush=True)
                      continue
                  try:
                      status2,listing=query(fileurl)
                      print('PFL_OSF_STORAGE_LIST',json.dumps({'status':status2,'entries':[
                         {'id':z.get('id'),'kind':z.get('type'),'name':z.get('attributes',{}).get('name'),
                          'provider':z.get('attributes',{}).get('provider'),'size':z.get('attributes',{}).get('size'),
                          'child_endpoint':z.get('relationships',{}).get('files',{}).get('links',{}).get('related',{}).get('href')}
                          for z in listing.get('data',[])[:30]],
                         'next_page':bool(listing.get('links',{}).get('next')),'human_rows_downloaded':False},ensure_ascii=False),flush=True)
                  except Exception as e:
                      print('PFL_OSF_FILE_LIST_BLOCKED',type(e).__name__,str(e)[:250],flush=True)
              except Exception as e:
                  print('PFL_OSF_NODE_BLOCKED',type(e).__name__,str(e)[:300],flush=True)
          PY
