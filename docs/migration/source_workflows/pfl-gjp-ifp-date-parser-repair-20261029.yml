name: PFL GJP IFP date parsing original source repair
on:
  push:
    branches:
      - research/pfl-empirical-exposure-rights-gate-20261029
    paths:
      - .github/workflows/pfl-gjp-ifp-date-parser-repair-20261029.yml
permissions:
  contents: read
jobs:
  source-date-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify original IFP hash and enumerate exact date formats only
        run: |
          python - <<'PY'
          import urllib.request,io,csv,hashlib,json,collections,datetime,re
          with urllib.request.urlopen(urllib.request.Request("https://dataverse.harvard.edu/api/access/datafile/2917330?format=original",headers={'User-Agent':'PFL-IFP-Date-Repair/1.0'}),timeout=30) as r:raw=r.read(1300001)
          assert hashlib.sha256(raw).hexdigest()=="1f64e5483741e656ddc667b310799e9aec8a8c5dbb7e12f9af5c5a60fd146286"
          rows=list(csv.DictReader(io.StringIO(raw.decode('utf-8-sig','replace'),newline='')))
          fields=['date_start','date_suspend','date_to_close','date_closed']
          formats=['%Y-%m-%d','%Y-%m-%d %H:%M:%S','%Y-%m-%dT%H:%M:%S','%m/%d/%Y','%m/%d/%Y %H:%M:%S','%d/%m/%Y','%Y/%m/%d','%Y-%m-%d %H:%M','%m/%d/%y','%Y-%m-%d %H:%M:%S.%f']
          out={}
          for key in fields:
              vals=[str(r.get(key) or '').strip() for r in rows]
              sentinels=set(['','NA','N/A','NULL','NONE','NAN','.'])
              missing=sum(v.upper() in sentinels for v in vals)
              counts={}
              for fmt in formats:
                  success=0
                  for v in vals:
                      try:datetime.datetime.strptime(v,fmt);success+=1
                      except (ValueError,TypeError):pass
                  counts[fmt]=success
              numeric=sum(bool(re.fullmatch(r'\d+(?:\.\d+)?',v)) for v in vals)
              signatures=collections.Counter(re.sub(r'\d','9',v)[:40] for v in vals)
              out[key]={'non_sentinel':len(vals)-missing,'missing_sentinels':missing,'numeric_strings':numeric,
                'formats_success':counts,'top_format_signatures':signatures.most_common(8),
                'four_literal_examples':list(dict.fromkeys(vals))[:4]}
          print('PFL_IFP_DATE_PARSER_REPAIR',json.dumps({'rows':len(rows),'fields':out,
             'source_sha256':hashlib.sha256(raw).hexdigest(),'no_human_data':True},ensure_ascii=False),flush=True)
          PY
