name: PFL empirical paper replication-link metadata
on:
  push:
    branches:
      - research/pfl-empirical-exposure-rights-gate-20261029
    paths:
      - .github/workflows/pfl-replication-link-metadata-20261029.yml
permissions:
  contents: read
jobs:
  public-landing-links-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect published author and publisher links, not raw participant datasets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          import urllib.request, urllib.error, json, re, urllib.parse
          class Links(HTMLParser):
              def __init__(self):super().__init__();self.active=None;self.arr=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="a":
                      a=dict(attrs);self.active={"href":a.get("href",""),"text":""}
              def handle_data(self,data):
                  if self.active is not None:self.active["text"]+=data
              def handle_endtag(self,tag):
                  if tag=="a" and self.active is not None:
                      self.arr.append(self.active);self.active=None
          pages=[
           ("hudja_author","https://web.ics.purdue.edu/~yrosokha/research.html"),
           ("lemus_marshall_author","https://g-marshall.github.io/"),
           ("lemus_marshall_journal","https://www.journals.uchicago.edu/doi/10.1086/711762")
          ]
          for name,url in pages:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Academic-Source-Metadata-Audit/1.0'}),timeout=18) as h:
                      raw=h.read(1500001);status=h.status
                  if len(raw)>1500000:raise RuntimeError("PAGE_TOO_LARGE")
                  html=raw.decode('utf8',errors='replace')
                  p=Links();p.feed(html)
                  terms=('github','software','data archive','supplement','replication','tournament','leaderboard','kaggle')
                  hits=[]
                  for x in p.arr:
                      txt=' '.join(x['text'].split())
                      href=urllib.parse.urljoin(url,x['href'])
                      if any(term in (txt+' '+href).lower() for term in terms):
                          hits.append({'label':txt[:110],'href':href[:400]})
                  print("PFL_PAPER_LINK_GATE",json.dumps({'name':name,'status':status,'links_total':len(p.arr),
                    'matching_links':hits[:35],'matches_truncated':len(hits)>35},ensure_ascii=False),flush=True)
              except Exception as e:
                  print("PFL_PAPER_LINK_GATE",json.dumps({'name':name,'status':'BLOCKED',
                    'error_type':type(e).__name__,'error':str(e)[:250]},ensure_ascii=False),flush=True)
          PY
