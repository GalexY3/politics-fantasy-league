name: PFL ABH25B C04 cumulative fictional standings
on:
  pull_request:
    paths:
      - .github/workflows/pfl-abh25b-standings.yml
permissions:
  contents: read
jobs:
  standings:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: C04 real SQLite and multi-round standings
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_abh25b_standings.py -v
      - name: C04 client text and missingness
        run: node --test tests/test_abh25b_standings_ui.mjs
      - name: C03 score explanation nonregression
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_abh25b_scorecard.py -v
      - run: node --check src/politics_fantasy/web/app.js
