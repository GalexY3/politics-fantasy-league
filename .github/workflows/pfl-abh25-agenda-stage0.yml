name: PFL ABH25 C03 official agenda metadata only
on:
  push:
    branches: [research/pfl-abh25-evidence-and-product-20261030]
    paths:
      - .github/workflows/pfl-abh25-agenda-stage0.yml
      - research/ABH25_20261030/c03_agenda_metadata_only.py
  pull_request:
    paths:
      - .github/workflows/pfl-abh25-agenda-stage0.yml
      - research/ABH25_20261030/c03_agenda_metadata_only.py
permissions:
  contents: read
jobs:
  official-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify metadata probe syntax
        run: python -m py_compile research/ABH25_20261030/c03_agenda_metadata_only.py
      - name: Download exactly one official agenda CSV and report schema only
        run: python research/ABH25_20261030/c03_agenda_metadata_only.py
