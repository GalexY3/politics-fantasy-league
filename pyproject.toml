[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "politics-fantasy-lab"
version = "0.7.0"
description = "Political data-science research laboratory with local synthetic fantasy prototype"
requires-python = ">=3.10"
license = {text = "All rights reserved pending explicit licensing decision"}
authors = []
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "pytest-subtests>=0.14", "numpy>=1.24", "tzdata>=2024.1"]
plots = ["matplotlib>=3.6"]
research = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.6", "tzdata>=2024.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
politics-fantasy-demo = "politics_fantasy.server:main"

[tool.setuptools.package-data]
politics_fantasy = ["web/*.html", "web/*.css", "web/*.js"]
