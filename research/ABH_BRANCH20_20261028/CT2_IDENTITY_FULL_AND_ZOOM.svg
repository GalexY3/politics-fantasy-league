<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-label="Dos gráficos de CT2 identidad ordinal: escala completa 0 a 100 y vista ampliada 20 a 35. Valor al inicio 29 y al final 29, sin datos intermedios evaluados">
<rect width="1100" height="420" fill="#ffffff"/>
<style>text{font-family:system-ui,Arial,sans-serif;fill:#1e293b;font-size:15px} .axis{stroke:#94a3b8;stroke-width:1.5}.grid{stroke:#e2e8f0;stroke-width:1}.line{stroke:#2563eb;stroke-width:3}.dot{fill:#2563eb} .note{font-size:13px;fill:#475569}</style>
<text x="38" y="35" font-size="22" font-weight="700">CT2 · identidad institucional (ordinal, no probabilidad)</text>
<text x="38" y="62" class="note">Solo existen dos observaciones documentales: inicio y cierre. No se infiere trayectoria por ciclo.</text>
<text x="45" y="105" font-weight="700">Escala completa (0–100)</text>
<g transform="translate(60,135)"><path class="axis" d="M0,0 V215 H430"/><path class="grid" d="M0,0H430 M0,107.5H430"/><text x="-15" y="7" text-anchor="end">100</text><text x="-15" y="115" text-anchor="end">50</text><text x="-15" y="222" text-anchor="end">0</text>
<path class="line" d="M65,152.65 H365"/><circle class="dot" cx="65" cy="152.65" r="6"/><circle class="dot" cx="365" cy="152.65" r="6"/>
<text x="65" y="143" text-anchor="middle">29</text><text x="365" y="143" text-anchor="middle">29</text><text x="65" y="245" text-anchor="middle">Inicio</text><text x="365" y="245" text-anchor="middle">Cierre</text></g>
<text x="580" y="105" font-weight="700">Vista ampliada (20–35)</text>
<g transform="translate(600,135)"><path class="axis" d="M0,0V215H430"/><path class="grid" d="M0,0H430 M0,71.67H430 M0,143.33H430"/><text x="-15" y="7" text-anchor="end">35</text><text x="-15" y="78" text-anchor="end">30</text><text x="-15" y="150" text-anchor="end">25</text><text x="-15" y="222" text-anchor="end">20</text>
<path class="line" d="M65,86 H365"/><circle class="dot" cx="65" cy="86" r="6"/><circle class="dot" cx="365" cy="86" r="6"/>
<text x="65" y="76" text-anchor="middle">29</text><text x="365" y="76" text-anchor="middle">29</text><text x="65" y="245" text-anchor="middle">Inicio</text><text x="365" y="245" text-anchor="middle">Cierre</text></g>
<text x="45" y="401" class="note">CT2 29/100 no equivale a probabilidad del 29 %. V4 36,90 %, VSDS 1/3 y gates 0/6 son medidas distintas.</text>
</svg>